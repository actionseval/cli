name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y adduser base-files bash bash-completion ca-certificates command-not-found coreutils cron dash debconf distro-info-data e2fsprogs fuse3 gettext-base hdparm keyutils libattr1:amd64 libaudit-common libc-bin libc6:amd64 libmagic1:amd64 libmecab2:amd64 libncursesw6:amd64 libpam-runtime libpython3.12-stdlib:amd64 libsensors-config libtirpc-common locales login logrotate lsb-release ltrace mailcap make man-db media-types multipath-tools nano ncurses-base netbase nftables openssl overlayroot procps python3-zope.interface python3.12 python3.12-venv rsyslog screen sudo tar tzdata ucf unixodbc-common usb-modeswitch walinuxagent wget
      - name: Build
        run: make install
      - name: Test
        run: make test